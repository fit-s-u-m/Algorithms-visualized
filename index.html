<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <title>Algorithms</title>
  <script src="./public/lib/all.min.js"></script>
</head>

<body>
  <div id="app"></div>
  <div id="btn-container" class="my-3 mx-2  flex-col">
    <div class="flex flex-col gap-2">
      <div id="history_label" class="text-center">History:0</div>

      <div class="gap-2 flex">
        <button id="prev" class="btns">prev</button>
        <button id="play" class="btns">pause</button>
        <button id="next" class="btns">next</button>
      </div>

      <div class="flex flex-row gap-2 width-100">

        <button id="restart" class="btns items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
              <path d="M12 3a9 9 0 1 1-5.657 2" />
              <path d="M3 4.5h4v4" />
            </g>
          </svg>
        </button>

        <label class="mute-toggle btns flex-1">
          <input type="checkbox" id="mute_checkbox" checked="checked" />

          <svg viewBox="0 0 24 24" width="2.5em" height="2.5em">
            <!-- UNMUTE ICON -->
            <g class="icon-unmute">
              <path d="M3 9v6h4l5 5V4L7 9H3z"/>
              <path d="M14 3.23v2.06c2.89 1 5 3.77 5 7.71s-2.11 6.71-5 7.71v2.06c4.01-1.07 7-4.71 7-9.77s-2.99-8.7-7-9.77z"/>
            </g>

            <!-- MUTE ICON -->
            <g class="icon-mute">
              <path d="M3 9v6h4l5 5V4L7 9H3z"/>
              <line x1="16" y1="8" x2="22" y2="14" stroke="#fbf1c7" stroke-width="2" stroke-linecap="round"/>
              <line x1="22" y1="8" x2="16" y2="14" stroke="#fbf1c7" stroke-width="2" stroke-linecap="round"/>
            </g>
          </svg>
        </label>
      </div>

    </div>


  </div>


  <div class=" z-[5] absolute top-0 right-0 mr-5 flex flex-row gap-10 mt-3 ">
    <div class="stats shadow p-0 m-5  invisible  lg:visible bg-accent z-[-40]">
      <div class="stat">
        <div class="stat-figure text-black">
          <svg xmlns="http://www.w3.org/2000/svg" class="inline-block h-8 w-8 fill-current"
            viewBox="0 0 512 512"><!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
            <path
              d="M320 488c0 9.5-5.6 18.1-14.2 21.9s-18.8 2.3-25.8-4.1l-80-72c-5.1-4.6-7.9-11-7.9-17.8s2.9-13.3 7.9-17.8l80-72c7-6.3 17.2-7.9 25.8-4.1s14.2 12.4 14.2 21.9l0 40 16 0c35.3 0 64-28.7 64-64l0-166.7C371.7 141 352 112.8 352 80c0-44.2 35.8-80 80-80s80 35.8 80 80c0 32.8-19.7 61-48 73.3L464 320c0 70.7-57.3 128-128 128l-16 0 0 40zM456 80a24 24 0 1 0 -48 0 24 24 0 1 0 48 0zM192 24c0-9.5 5.6-18.1 14.2-21.9s18.8-2.3 25.8 4.1l80 72c5.1 4.6 7.9 11 7.9 17.8s-2.9 13.3-7.9 17.8l-80 72c-7 6.3-17.2 7.9-25.8 4.1s-14.2-12.4-14.2-21.9l0-40-16 0c-35.3 0-64 28.7-64 64l0 166.7c28.3 12.3 48 40.5 48 73.3c0 44.2-35.8 80-80 80s-80-35.8-80-80c0-32.8 19.7-61 48-73.3L48 192c0-70.7 57.3-128 128-128l16 0 0-40zM56 432a24 24 0 1 0 48 0 24 24 0 1 0 -48 0z" />
          </svg>
        </div>
        <div class="stat-title text-black">Comparition</div>
        <div class="stat-value text-black" id="num-comp">0</div>
        <div class="stat-desc text-black">num</div>
      </div>

      <div class="stat text-black ">
        <div class="stat-figure text-black">
          <svg xmlns="http://www.w3.org/2000/svg" class="inline-block h-8 w-8 stroke-current fill-current"
            viewBox="0 0 512 512">
            <path
              d="M32 96l320 0 0-64c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l96 96c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-96 96c-9.2 9.2-22.9 11.9-34.9 6.9s-19.8-16.6-19.8-29.6l0-64L32 160c-17.7 0-32-14.3-32-32s14.3-32 32-32zM480 352c17.7 0 32 14.3 32 32s-14.3 32-32 32l-320 0 0 64c0 12.9-7.8 24.6-19.8 29.6s-25.7 2.2-34.9-6.9l-96-96c-6-6-9.4-14.1-9.4-22.6s3.4-16.6 9.4-22.6l96-96c9.2-9.2 22.9-11.9 34.9-6.9s19.8 16.6 19.8 29.6l0 64 320 0z" />
          </svg>
        </div>
        <div class="stat-title text-black">Swap</div>
        <div class="stat-value text-black" id="num-swap">0</div>
        <div class="stat-desc text-black">num</div>
      </div>

    </div>
    <div>
      <div class="slider">
        <label for="slider" class="text-accent-light" id="slider-label">Speed</label>
        <input id="slider" type="range" min="0" max="10" value="4" class="range" step="1" />
        <div id="tick" class="flex w-full justify-between px-2 text-xs text-accent">
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
          <span>|</span>
        </div>
      </div>
      <select id="select" class="select select-accent w-full max-w-xs choose select-sm bg-accent text-black mx-2 my-5">
        <option selected>Bubble Sort</option>
        <option>Insertion Sort</option>
        <option>Selection Sort</option>
        <option>Merge Sort</option>
        <option>Heap Sort</option>
      </select>
      <select id="scale" class="select select-accent w-full max-w-xs choose select-sm bg-accent text-black mx-2">
        <option selected>አንቺሆዬ</option>
        <option>ትዝታ</option>
        <option>ትዝታ ማይነር</option>
        <option>ባቲ</option>
        <option>አምባሰል</option>
      </select>

    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>


</html>
